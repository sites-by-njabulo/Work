<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Work</title>
  <meta name="description" content="31 day communication skills challenge tracker.">
  <meta name="theme-color" content="#1e1f22">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- First run: no start date yet -->
  <section class="start-screen" id="startScreen" hidden>
    <div class="start-inner">
      <p class="start-kicker">Work</p>
      <h1 class="start-title">31 days. Say it like you mean it.</h1>
      <p class="start-sub">Film daily. Review honestly. Drill the voice. 40 minutes a day for 31 days.</p>
      <button class="btn-primary" id="startTodayBtn" type="button">Start Day 1 today</button>
      <button class="btn-ghost" id="startPickBtn" type="button">I already started on another date</button>
      <div class="start-pick" id="startPickRow" hidden>
        <label for="startDateInput">Day 1 was on</label>
        <input type="date" id="startDateInput">
        <button class="btn-primary btn-small" id="startConfirmBtn" type="button">Set start date</button>
      </div>
    </div>
  </section>

  <main class="app" id="appShell" hidden></main>

  <script src="js/plan.js"></script>
  <script src="js/store.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
